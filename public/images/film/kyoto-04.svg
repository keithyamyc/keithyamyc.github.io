<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750" width="1000" height="750">
  <rect width="1000" height="750" fill="#14100E"/>
  <!-- night alley, lantern light -->
  <rect x="0" y="420" width="1000" height="330" fill="#1E1814"/>
  <g fill="#C8552F" opacity="0.9">
    <ellipse cx="180" cy="250" rx="40" ry="54"/>
    <ellipse cx="330" cy="215" rx="34" ry="46"/>
    <ellipse cx="700" cy="230" rx="38" ry="50"/>
    <ellipse cx="850" cy="270" rx="44" ry="58"/>
  </g>
  <g fill="#F2C57C" opacity="0.22">
    <ellipse cx="180" cy="380" rx="120" ry="80"/>
    <ellipse cx="700" cy="390" rx="130" ry="86"/>
  </g>
  <!-- noren curtains and doorways -->
  <rect x="90" y="330" width="180" height="150" fill="#2B2118"/>
  <rect x="610" y="340" width="190" height="150" fill="#2B2118"/>
  <g stroke="#3A2C21" stroke-width="4">
    <line x1="180" y1="330" x2="180" y2="480"/>
    <line x1="700" y1="340" x2="700" y2="490"/>
  </g>
  <!-- wet cobbles with reflections -->
  <g fill="#7A3A22" opacity="0.45">
    <rect x="150" y="560" width="60" height="8"/>
    <rect x="660" y="590" width="80" height="7"/>
    <rect x="420" y="630" width="50" height="6"/>
  </g>
  <rect width="1000" height="750" fill="url(#none)" opacity="0"/>
</svg>
