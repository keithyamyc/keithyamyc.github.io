    <line x1="0" y1="620" x2="1000" y2="634"/>
    <line x1="0" y1="700" x2="1000" y2="712"/>
  </g>
  <!-- bowl -->
  <ellipse cx="500" cy="520" rx="270" ry="92" fill="#E8E2D6"/>
  <ellipse cx="500" cy="512" rx="235" ry="76" fill="url(#broth)"/>
  <ellipse cx="500" cy="506" rx="235" ry="76" fill="none" stroke="#F2EDE3" stroke-width="10"/>
  <!-- noodles -->
  <g stroke="#F0D9A8" stroke-width="7" fill="none" opacity="0.9">
    <path d="M330 500 Q400 470 470 502 T610 500"/>
    <path d="M350 518 Q430 488 500 516 T660 512"/>
