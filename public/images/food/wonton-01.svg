<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750" width="1000" height="750">
  <defs>
    <radialGradient id="broth" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#D9B26A"/>
      <stop offset="70%" stop-color="#B98A3F"/>
      <stop offset="100%" stop-color="#8C6327"/>
