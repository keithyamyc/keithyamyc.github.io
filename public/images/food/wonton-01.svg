  </defs>
  <rect width="1000" height="750" fill="#2E2A25"/>
  <!-- wooden table -->
  <rect x="0" y="470" width="1000" height="280" fill="#4A3B2C"/>
  <g stroke="#3B2E22" stroke-width="2" opacity="0.7">
